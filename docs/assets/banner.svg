<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
<title id="t">Who Actually Benefits? Causal machine learning for targeted intervention</title>
<desc id="d">Animated Qini curves on the 2,000,000 user holdout, for the response baseline and the X-learner on visits, against random targeting.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#143049"/></linearGradient>
<linearGradient id="gx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4dd0e1"/><stop offset="1" stop-color="#80ffdb"/></linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.curve{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 8s ease-in-out infinite}
.resp{stroke:#b6c0cf;stroke-width:2.5;animation-delay:.2s}
.xl{stroke:url(#gx);stroke-width:3.5;animation-delay:.6s}
.rand{fill:none;stroke:#7d8ba1;stroke-width:1.6;stroke-dasharray:6 6}
.dot{fill:#80ffdb;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out infinite}
.fade{opacity:0;animation:fade 8s ease-in-out infinite}
.c1{animation-delay:.2s}.c2{animation-delay:.5s}.c3{animation-delay:.8s}.c4{animation-delay:1.1s}
@keyframes draw{0%{stroke-dashoffset:1}42%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
@keyframes fade{0%,38%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.9);opacity:.55}}
@media (prefers-reduced-motion:reduce){.curve,.fade,.dot{animation:none;stroke-dashoffset:0;opacity:1}}
</style>
<rect width="1200" height="360" rx="18" fill="url(#bg)"/>
<text x="60" y="106" font-size="46" font-weight="800" fill="#ffffff">Who Actually Benefits?</text>
<text x="62" y="146" font-size="21" fill="#a9b8cc">Causal machine learning for targeted intervention</text>
<text x="62" y="176" font-size="16" fill="#7f93ad">Criteo Uplift dataset  |  CSC1181  |  Group 12</text>
